plugins {
    id 'java'
}

group = 'me.Mixer'
version = '3.1.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        name = 'jitpack'
        url = uri('https://jitpack.io')
    }
    maven {
        name = 'extendedclip'
        url = uri('https://repo.extendedclip.com/releases/')
    }
}

// Minimal API stubs for the closed-source Residence plugin. These are compiled only against the
// compile classpath and are NEVER packaged into the plugin jar (the default `jar` task only takes
// sourceSets.main.output). At runtime the real Residence plugin supplies these classes.
sourceSets {
    stub
}

dependencies {
    // Paper API carries the Bukkit API plus the Folia region schedulers
    // (io.papermc.paper.threadedregions.scheduler.*) even on non-Folia servers.
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    // BlueMap API (matches BlueMap 5.x). Marker API is thread-safe and may be written off the main thread.
    compileOnly 'com.github.BlueMap-Minecraft:BlueMapAPI:2.6.2'
    // Optional soft dependency.
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // Residence API stubs, provided at compile time only.
    compileOnly sourceSets.stub.output

    // The stubs themselves need the Bukkit API to reference org.bukkit.* types.
    stubCompileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
}

jar {
    archiveBaseName = 'BlueMap-Residence-Folia'
    archiveClassifier = ''
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
